services:
  api-dev:
    image: ${DOCKER_REGISTRY-}posterpresentation
    container_name: api-container
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Poster.Presentation/Dockerfile
    ports:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings:"Server=localhost;Database=PosterDb;Trusted_Connection=True;MultipleActiveResultSets=true;Encrypt=True;TrustServerCertificate=True;"
    volumes:
      - .:/src
      - /src/bin
      - /src/obj
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: db-container
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${DB_PASSWORD}
        - -C
        - -Q
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ui-dev:
    image: poster-ui
    container_name: ui-container
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api-dev
    networks:
      - app-network

  networks:
   app-network:
    driver: bridge

  volumes:
   sqlserver_data:
