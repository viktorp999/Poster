services:
  poster-api:
    image: poster-api-image
    container_name: poster-api-container
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Poster.Presentation/Dockerfile
    ports:
      - ${APP_PORT}
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENV}
      - ConnectionStrings:"Server=${DB_HOST};Database=PosterDb;Trusted_Connection=True;MultipleActiveResultSets=true;Encrypt=True;TrustServerCertificate=True;"
    volumes:
      - .:/src
      - /src/bin
      - /src/obj
    depends_on:
      - poster-db
    networks:
      - app-network

  poster-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: poster-db-container
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA}
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${DB_PASSWORD}
        - -C
        - -Q
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  poster-ui:
    image: poster-ui-image
    container_name: poster-ui-container
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/Poster.UI/Dockerfile
    ports:
      - "4200:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - poster-api
    networks:
      - app-network

networks:
  app-network:
   driver: bridge

volumes:
   sqlserver_data:
